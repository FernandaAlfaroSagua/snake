<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Snake.io Demo</title>
  <style>
    body { margin: 0; background: #111; color: #eee; font-family: sans-serif; text-align: center; }
    #join { margin: 20px; }
    canvas { background: #1b1b1b; border: 2px solid #444; max-width: 100%; }
    #leaderboard { position: fixed; top: 10px; right: 10px; min-width: 180px; padding: 8px 12px; background: rgba(0, 0, 0, 0.7); border: 1px solid #444; text-align: left; }
    #leaderboard h2 { margin: 0 0 6px; font-size: 14px; }
    #leaderboard ol { margin: 0; padding-left: 20px; font-size: 13px; }
    #leaderboard li.me { font-weight: bold; }
    #leaderboard .badge { margin-left: 6px; padding: 0 4px; border-radius: 3px; background: #f58231; color: #111; font-size: 11px; }
  </style>
</head>
<body>
  <div id="join">
    <input id="name" placeholder="Your name" maxlength="16">
    <button id="play">Play</button>
  </div>
  <canvas id="game" width="800" height="600"></canvas>
  <!-- ui-extras: extra DOM panels (e.g. leaderboard) go here -->
  <div id="leaderboard">
    <h2>Leaderboard</h2>
    <ol id="leaderboard-list"></ol>
  </div>
  <script src="/socket.io/socket.io.js"></script>
  <script src="render.js"></script>
  <script src="main.js"></script>
</body>
</html>
